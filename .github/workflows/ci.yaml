name: Unit Tests

on:
  push:
    branches:
      - master
  pull_request: ~

env:
  SYMFONY_DEPRECATIONS_HELPER: weak

jobs:
  unit-test:
    name: Unit ( PHP ${{ matrix.php }} )
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: 8.1
          - php: 8.2
          - php: 8.3
          - php: 8.4
          - php: 8.5

    steps:
      - name: Checkout
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: Setup PHP
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, opcache, mysql, pdo_mysql
          coverage: none

      - name: Install dependencies
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0

      - name: Run unit tests
        run: bin/phpunit

  lowest:
    name: Unit ( PHP ${{ matrix.php }} + Lowest )
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: 8.1
          - php: 8.2
          - php: 8.3
          - php: 8.4
          - php: 8.5

    steps:
      - name: Checkout
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: Setup PHP
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, opcache, mysql, pdo_mysql
          coverage: none

      - name: Install dependencies
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0
        with:
          dependency-versions: "lowest"

      - name: Run unit tests
        run: bin/phpunit

  mongodb:
    name: Unit ( PHP ${{ matrix.php }} + MongoDB )
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: 8.1
            mongodb: [6, 7, 8]
          - php: 8.2
            mongodb: [6, 7, 8]
          - php: 8.3
            mongodb: [6, 7, 8]
          - php: 8.4
            mongodb: [6, 7, 8]
          - php: 8.5
            mongodb: [6, 7, 8]

    steps:
      - name: Checkout
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: Setup PHP
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, opcache, mysql, pdo_mysql, mongodb
          coverage: none

      - name: Start MongoDB
        uses: "supercharge/mongodb-github-action@315db7fe45ac2880b7758f1933e6e5d59afd5e94" # v1.12.1
        with:
          mongodb-version: ${{ matrix.mongodb }}

      - name: Install dependencies
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0

      - name: Install Doctrine Mongodb ODM
        run: composer require doctrine/mongodb-odm --with-all-dependencies

      - name: Run unit tests
        run: bin/phpunit
